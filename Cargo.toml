[package]
name = "uuidnew"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
clicmd = { version = "0.1", path = "../clicmd" }
colorchoice-clap = "1.0"
rand = "0.10"
tracing = "0.1"
uuid = { version = "1.28.0", features = [
    "v1",
    "v3",
    "v4",
    "v5",
    "v6",
    "v7",
    "v8",
] }
