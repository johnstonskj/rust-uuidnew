[package]
name = "uuidnew"
description = "Provides a simple cli for generating UUIDs, but with more options than uuidgen."
version = "0.1.0"
edition = "2024"
authors = ["Simon Johnston <johnstonskj@gmail.com"]
repository = "https://github.com/johnstonskj/rust-uuidnew"
homepage = "https://simonkjohnston.life/rust-uuidnew"
license = "MIT OR Apache-2.0"
keywords = ["cli", "uuid"]
# readme = "README.md"
publish = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
clicmd = { version = "0.1", path = "../clicmd" }
colorchoice-clap = "1.0"
rand = "0.10"
tracing = "0.1"
uuid = { version = "1.28.0", features = [
    "v1",
    "v3",
    "v4",
    "v5",
    "v6",
    "v7",
    "v8",
] }
